name: Apply Messages Frontend V2 on test branch

on:
  push:
    branches: [chatgpt/messages-frontend-lock]

permissions:
  contents: write

jobs:
  apply-and-check:
    if: "!contains(github.event.head_commit.message, '[messages-v2-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/messages-frontend-lock
          fetch-depth: 0

      - name: Insert Messages V2 loader in dist/index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('dist/index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="messages-frontend-v2.js?v=20260812" defer></script>'
          if tag not in text:
              if '</body>' not in text:
                  raise SystemExit('dist/index.html: balise </body> introuvable')
              text = text.replace('</body>', tag + '\n</body>', 1)
              p.write_text(text, encoding='utf-8')

      - name: Frontend checks
        run: |
          set -euxo pipefail
          node --check dist/messages-frontend-v2.js
          grep -F '<script src="messages-frontend-v2.js?v=20260812" defer></script>' dist/index.html >/dev/null
          grep -F "parent_to_dir" dist/messages-frontend-v2.js >/dev/null
          grep -F "openForwardParentMessage" dist/messages-frontend-v2.js >/dev/null
          grep -F "sendForwardParentMessage" dist/messages-frontend-v2.js >/dev/null
          grep -F "openRelayTeacherMessage" dist/messages-frontend-v2.js >/dev/null
          grep -F "sendRelayTeacherMessage" dist/messages-frontend-v2.js >/dev/null
          grep -F "openArchivedMessages" dist/messages-frontend-v2.js >/dev/null
          grep -F "return original.openComposeMsg()" dist/messages-frontend-v2.js >/dev/null
          grep -F "return original.sendMsg(mode)" dist/messages-frontend-v2.js >/dev/null
          test "$(grep -Fc '<script src=\"messages-frontend-v2.js?v=20260812\" defer></script>' dist/index.html)" -eq 1

      - name: Commit branch integration
        run: |
          if git diff --quiet -- dist/index.html; then
            echo 'Loader already present.'
            exit 0
          fi
          git config user.name 'SchoolSafe ChatGPT'
          git config user.email 'actions@users.noreply.github.com'
          git add dist/index.html
          git commit -m 'feat(messages): activer V2 sur branche de recette [messages-v2-applied]'
          git push origin HEAD:chatgpt/messages-frontend-lock
