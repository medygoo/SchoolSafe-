name: ChatGPT login resilience fast patch

on:
  push:
    branches:
      - chatgpt/login-resilience-fast

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/login-resilience-fast

      - name: Patch login resilience without startup network calls
        shell: python
        run: |
          from pathlib import Path

          path = Path('dist/messages-frontend-v2.js')
          src = path.read_text(encoding='utf-8')
          marker = '__SS_LOGIN_RESILIENCE_FAST__'
          if marker in src:
              print('Patch already present')
              raise SystemExit(0)

          patch = r'''/*
           * SchoolSafe — connexion rapide et résiliente
           * Aucun appel réseau au chargement de la page : l’écran d’accueil
           * reste instantané. Le diagnostic supplémentaire ne s’exécute
           * qu’après un échec réel de connexion.
           */
          (function installSchoolSafeFastLoginResilience() {
            'use strict';

            if (window.__SS_LOGIN_RESILIENCE_FAST__) return;
            if (typeof window._loginRelais !== 'function') return;
            if (typeof OPS_SUPA_URL === 'undefined' || typeof OPS_SUPA_KEY === 'undefined') return;

            const LOGIN_TIMEOUT_MS = 6000;
            const PROBE_TIMEOUT_MS = 900;
            const state = window.__SS_LOGIN_RESILIENCE_FAST__ = {
              version: '2026-08-12.1',
              startupNetworkCalls: 0,
              last: null,
            };

            const probeHostReachable = async () => {
              if (navigator.onLine === false) return false;
              const ctrl = new AbortController();
              const timer = setTimeout(() => ctrl.abort(), PROBE_TIMEOUT_MS);
              try {
                // no-cors : on cherche seulement à savoir si l’hôte répond au
                // téléphone. Aucun identifiant, mot de passe ou clé n’est envoyé.
                await fetch(`${OPS_SUPA_URL}/auth/v1/health`, {
                  method: 'GET',
                  mode: 'no-cors',
                  cache: 'no-store',
                  signal: ctrl.signal,
                });
                return true;
              } catch (_) {
                return false;
              } finally {
                clearTimeout(timer);
              }
            };

            window._loginRelais = async (channel, identifier, password) => {
              const startedAt = Date.now();
              state.last = null;

              if (navigator.onLine === false) {
                state.last = { at:Date.now(), kind:'offline', reachable:false, elapsed_ms:0 };
                return { ok:false, code:'NETWORK_ERROR', raw:null };
              }

              const ctrl = new AbortController();
              let timedOut = false;
              const timer = setTimeout(() => {
                timedOut = true;
                ctrl.abort();
              }, LOGIN_TIMEOUT_MS);

              try {
                const r = await fetch(`${OPS_SUPA_URL}/functions/v1/school-login`, {
                  method: 'POST',
                  headers: {
                    apikey: OPS_SUPA_KEY,
                    Authorization: 'Bearer ' + OPS_SUPA_KEY,
                    'Content-Type': 'application/json',
                  },
                  body: JSON.stringify({ channel, identifier, password }),
                  cache: 'no-store',
                  signal: ctrl.signal,
                });
                const d = await r.json().catch(() => null);
                state.last = {
                  at: Date.now(), kind:'http', reachable:true,
                  status:r.status, elapsed_ms:Date.now()-startedAt,
                };
                if (!r.ok || d?.ok !== true) {
                  return { ok:false, code:(d && d.code) || ('HTTP_' + r.status), raw:d };
                }
                return { ok:true, data:d };
              } catch (e) {
                const reachable = await probeHostReachable();
                state.last = {
                  at: Date.now(),
                  kind: timedOut ? 'timeout' : 'network',
                  reachable,
                  elapsed_ms: Date.now()-startedAt,
                };
                return { ok:false, code:'NETWORK_ERROR', raw:e };
              } finally {
                clearTimeout(timer);
              }
            };

            // L’écran existant sait déjà afficher NETWORK_ERROR. On affine
            // seulement son texte quand le diagnostic prouve que l’hôte est
            // joignable : on ne traite plus toute panne de liaison comme une
            // panne du serveur.
            const rewriteNetworkMessage = () => {
              const el = document.getElementById('PM');
              const d = state.last;
              if (!el || !d || Date.now() - d.at > 15000 || navigator.onLine === false) return;
              const text = el.textContent || '';
              if (!text.includes('Le serveur de l’école ne répond pas')) return;

              if (d.reachable && d.kind === 'timeout') {
                el.textContent = 'La connexion est trop lente — le serveur est joignable. Réessayez.';
              } else if (d.reachable && d.kind === 'network') {
                el.textContent = 'La liaison de connexion a été interrompue — le serveur est joignable. Réessayez.';
              } else if (!d.reachable && d.kind === 'timeout') {
                el.textContent = 'Connexion trop lente ou serveur momentanément inaccessible — réessayez.';
              }
            };

            const observeLoginMessage = () => {
              const el = document.getElementById('PM');
              if (!el) return;
              const observer = new MutationObserver(rewriteNetworkMessage);
              observer.observe(el, { childList:true, subtree:true, characterData:true });
            };

            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', observeLoginMessage, { once:true });
            } else {
              observeLoginMessage();
            }
          })();

          '''
          path.write_text(patch + src, encoding='utf-8')
          print('Login resilience patch inserted')

      - name: Verify JavaScript syntax
        run: node --check dist/messages-frontend-v2.js

      - name: Run SchoolSafe audits
        run: npm run audit

      - name: Commit tested patch
        run: |
          if git diff --quiet -- dist/messages-frontend-v2.js; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "chatgpt-school-safe"
          git config user.email "noreply@openai.com"
          git add dist/messages-frontend-v2.js
          git commit -m "fix(login): connexion rapide, bornée et diagnostic réseau fiable"
          git push origin HEAD:chatgpt/login-resilience-fast
