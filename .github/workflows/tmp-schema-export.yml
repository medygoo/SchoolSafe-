name: Temporary SchoolSafe schema export

on:
  push:
    branches:
      - agent/schema-reference-p07
    paths:
      - '.github/workflows/tmp-schema-export.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-schema-export.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/schema-reference-p07

      - name: Export structural schema snapshot
        env:
          SUPABASE_URL: https://lcnronymkccgyltttqry.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_riSfIF1hT5-imh4uq4bUmQ_b5poe7hG
        shell: bash
        run: |
          set -euo pipefail
          response="$(mktemp)"
          status="$(curl --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 60 \
            --output "$response" --write-out '%{http_code}' \
            --request POST \
            "${SUPABASE_URL}/rest/v1/rpc/export_schema_audit_snapshot" \
            --header "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            --header 'Content-Type: application/json' \
            --data '{}')"
          test "$status" = "200"
          mkdir -p supabase/migrations
          jq -r '.' "$response" > supabase/migrations/20260804180000_schema_reference_snapshot.sql

          grep -q 'CREATE TABLE public.students' supabase/migrations/20260804180000_schema_reference_snapshot.sql
          grep -q 'CREATE POLICY "snapshot_students_select"' supabase/migrations/20260804180000_schema_reference_snapshot.sql
          ! grep -q 'lcnronymkccgyltttqry' supabase/migrations/20260804180000_schema_reference_snapshot.sql
          ! grep -q 'sb_publishable_' supabase/migrations/20260804180000_schema_reference_snapshot.sql
          ! grep -q 'service_role' supabase/migrations/20260804180000_schema_reference_snapshot.sql

      - name: Commit generated snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SchoolSafe schema exporter'
          git config user.email 'actions@users.noreply.github.com'
          git add supabase/migrations/20260804180000_schema_reference_snapshot.sql
          git diff --cached --quiet && exit 0
          git commit -m 'docs(schema): add live structural snapshot for audit'
          git push origin HEAD:agent/schema-reference-p07
