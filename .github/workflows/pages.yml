name: Deploy SchoolSafe public site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write        # pour porter un échec de publication dans le canal

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Ce contrôle exigeait EXACTEMENT 144 fichiers dans `dist`. Le jour où
      # l'application en a compté 164 — des images du site, rien de plus — la
      # publication s'est mise à échouer, et elle a échoué à CHAQUE fusion
      # pendant des heures : l'écran de connexion corrigé, les préinscriptions,
      # tout restait dans `main` sans jamais atteindre l'école. Personne ne
      # regardait la croix rouge.
      #
      # Un nombre exact n'exprimait pas ce qu'on voulait vérifier. Ce qu'on
      # veut, c'est : l'artefact n'est pas vide, et il ne contient RIEN qui
      # doive rester privé.
      - name: Vérifier ce qui va être publié
        run: |
          set -e
          nb=$(find dist -type f | wc -l)
          echo "dist contient $nb fichiers."
          if [ "$nb" -lt 100 ]; then
            echo "✗ Artefact incomplet — moins de 100 fichiers. Rien n'est publié."
            exit 1
          fi
          test -f dist/index.html || { echo "✗ dist/index.html manque"; exit 1; }
          test -f dist/auth.html  || { echo "✗ dist/auth.html manque";  exit 1; }
          test -s dist/index.html || { echo "✗ dist/index.html est vide"; exit 1; }
          # Ce qui ne doit JAMAIS partir en public.
          interdit=0
          for f in dist/admin.html dist/diagnostic.html dist/supabase; do
            if [ -e "$f" ]; then echo "✗ $f ne doit pas être publié"; interdit=1; fi
          done
          [ "$interdit" = "1" ] && exit 1
          echo "✓ Prêt à publier."
          exit 0
      - uses: actions/configure-pages@v4
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - id: deployment
        uses: actions/deploy-pages@v4

      # Un échec de publication doit VENIR À NOUS, pas nous attendre.
      #
      # La publication a échoué à chaque fusion pendant des heures — l'écran de
      # connexion corrigé, les préinscriptions, le schéma : tout restait dans
      # `main` sans jamais atteindre l'école. Le contrôle disait bien non, mais
      # il le disait dans un onglet que personne n'ouvre. Une croix rouge qu'on
      # ne regarde pas est un échec silencieux, exactement ce que nos audits
      # cherchent partout ailleurs.
      #
      # Désormais un échec ouvre une issue, dans le canal que les deux agents
      # lisent avant chaque intervention.
      - name: Signaler l'échec dans le canal
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const titre = '⚠️ La publication a échoué — rien n\'est en ligne';
            const corps = [
              '**La dernière fusion dans `main` n\'a pas atteint l\'école.**',
              '',
              `Commit : \`${context.sha.slice(0,7)}\``,
              `Détail : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Le site en ligne reste celui d\'avant — rien n\'est cassé côté école.',
              'Mais tant que ceci n\'est pas réglé, **aucune correction fusionnée n\'arrive**.',
              '',
              'Cette issue se referme d\'elle-même à la première publication réussie.',
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');
            const ouvertes = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'publication',
            });
            if (ouvertes.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: ouvertes.data[0].number, body: corps,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: titre, body: corps, labels: ['publication'],
              });
            }

      - name: Refermer l'alerte si tout est revenu
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const ouvertes = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'publication',
            });
            for (const i of ouvertes.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: i.number,
                body: `✅ Publication rétablie — commit \`${context.sha.slice(0,7)}\`.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number, state: 'closed', state_reason: 'completed',
              });
            }
