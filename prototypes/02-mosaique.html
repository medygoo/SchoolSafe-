<style>
/* ══════════════════════════════════════════════════════════════
   JETONS DU DOCUMENT (la page autour du prototype)
   ══════════════════════════════════════════════════════════════ */
:root{
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --d-bg:#EEF1F8; --d-surf:#FFFFFF; --d-line:#D9E0EE; --d-t1:#0C1220; --d-t2:#525E78; --d-t3:#6A7590;
  --d-blue:#1B45B8; --d-blue-w:#E8EEFC;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --d-bg:#05080F; --d-surf:#0E1523; --d-line:rgba(255,255,255,.11); --d-t1:#EAEEF8; --d-t2:#9BA7C2; --d-t3:#7B879F;
  --d-blue:#7D9CF7; --d-blue-w:rgba(125,156,247,.13);
}}
:root[data-theme="dark"]{
  --d-bg:#05080F; --d-surf:#0E1523; --d-line:rgba(255,255,255,.11); --d-t1:#EAEEF8; --d-t2:#9BA7C2; --d-t3:#7B879F;
  --d-blue:#7D9CF7; --d-blue-w:rgba(125,156,247,.13);
}
*{box-sizing:border-box}
body{margin:0;background:var(--d-bg);color:var(--d-t1);font:400 15px/1.55 var(--ui);-webkit-font-smoothing:antialiased}
:where(a,button,input,select,[tabindex]):focus-visible{outline:2px solid var(--d-blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ── barre de démonstration ── */
.demo{display:flex;align-items:center;gap:24px;flex-wrap:wrap;padding:14px 20px;background:var(--d-surf);border-bottom:1px solid var(--d-line);position:sticky;top:0;z-index:200}
.demo-brand{display:flex;align-items:center;gap:11px;margin-right:auto}
.demo-brand b{display:block;font:700 16px/1.2 var(--ui);letter-spacing:-.02em}
.demo-brand span{display:block;font:400 11.5px/1.4 var(--ui);color:var(--d-t3)}
.demo-mark{width:34px;height:38px;display:block;flex:none}
.demo-mark svg{width:100%;height:100%;display:block}
.demo-ctl{display:flex;gap:20px;flex-wrap:wrap}
.demo-grp{display:flex;flex-direction:column;gap:5px}
.demo-lbl{font:600 9.5px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--d-t3)}
.demo-seg{display:flex;gap:2px;background:var(--d-bg);border:1px solid var(--d-line);border-radius:8px;padding:2px}
.demo-seg button{border:none;background:none;padding:6px 10px;border-radius:6px;font:600 12px/1 var(--ui);color:var(--d-t2);cursor:pointer;white-space:nowrap}
.demo-seg button:hover{color:var(--d-t1)}
.demo-seg button[aria-pressed="true"]{background:var(--d-blue);color:#fff}
:root[data-theme="dark"] .demo-seg button[aria-pressed="true"]{color:#05080F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .demo-seg button[aria-pressed="true"]{color:#05080F}}
@media (prefers-color-scheme:dark){:root[data-theme="light"] .demo-seg button[aria-pressed="true"]{color:#fff}}
.demo-hint{max-width:1400px;margin:14px auto 0;padding:0 20px;font-size:13px;line-height:1.6;color:var(--d-t2)}
.demo-hint kbd{font:600 11px/1 var(--ui);background:var(--d-surf);border:1px solid var(--d-line);border-bottom-width:2px;border-radius:4px;padding:3px 5px;color:var(--d-t1)}

.stage{max-width:1400px;margin:16px auto 0;padding:0 20px}
.app-root{border:1px solid var(--d-line);border-radius:16px;overflow:hidden;box-shadow:0 18px 50px rgba(8,14,30,.13);margin:0 auto;transition:max-width .3s ease}
.app-root[data-dev="desk"]{max-width:100%}
.app-root[data-dev="tab"]{max-width:900px}
.app-root[data-dev="phone"]{max-width:390px;border-radius:26px}

.after{max-width:1400px;margin:0 auto;padding:44px 20px 90px}
.after h2{font:700 clamp(24px,3.4vw,34px)/1.15 var(--ui);letter-spacing:-.025em;margin:0 0 14px}
.after h3{font:650 16px/1.3 var(--ui);margin:0 0 10px}
.after p{max-width:74ch;color:var(--d-t2);font-size:14.5px;margin:0 0 12px}
.after .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:30px;margin-top:26px}
.after .box{background:var(--d-surf);border:1px solid var(--d-line);border-radius:12px;padding:22px 24px}
.after ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.after li{font-size:13.5px;line-height:1.6;color:var(--d-t2);padding-left:17px;position:relative}
.after li::before{content:"";position:absolute;left:0;top:.62em;width:7px;height:7px;background:var(--d-blue)}
.after li b{color:var(--d-t1);font-weight:600}
.after code{font:500 .88em var(--mono);background:var(--d-blue-w);padding:2px 5px;border-radius:4px}
.after .flag{border-left:3px solid #B25A06;background:rgba(178,90,6,.08);padding:14px 18px;border-radius:0 10px 10px 0;font-size:14px;color:var(--d-t1);max-width:80ch}

/* ══════════════════════════════════════════════════════════════
   JETONS DU PROTOTYPE — tirés du logo
   ══════════════════════════════════════════════════════════════ */
.app-root[data-t="light"]{
  --bleu:#1E4FCB; --bleu-t:#1B45B8; --bleu-deep:#12358F; --bleu-w:#E9EEFC; --bleu-b:#C6D5F7;
  --or:#F5B21B; --or-t:#8A6206; --or-w:#FDF2D8; --or-b:#F4DCA0;
  --rouge:#E0231D; --rouge-t:#C41A15; --rouge-w:#FCE7E6; --rouge-b:#F6C0BD;
  --orange:#F07C0C; --orange-t:#A85405; --orange-w:#FDEDDC; --orange-b:#F7CFA4;
  --vert:#0FA35C; --vert-t:#0A7A44; --vert-w:#E1F5EA; --vert-b:#A7E0C2;
  --violet:#7B3FE4; --violet-t:#6B32C9; --violet-w:#F0E9FD; --violet-b:#D5C2F8;
  --gris-t:#4A5568;
  --canvas:#F5F7FC; --surf:#FFFFFF; --surf2:#EEF2FA; --line:#DCE3F0; --line2:#EAEFF8;
  --t1:#0C1220; --t2:#525E78; --t3:#6A7590;
  --rail:#12358F; --rail2:#0E2A73; --rail-t:#FFFFFF; --rail-t2:#A9BCEB; --rail-h:rgba(255,255,255,.11); --rail-b:rgba(255,255,255,.14);
  --on-bleu:#FFFFFF; --on-or:#0C1220;
  --sh:0 2px 10px rgba(12,22,52,.08); --sh2:0 16px 44px rgba(12,22,52,.20);
}
.app-root[data-t="dark"]{
  --bleu:#6E93FA; --bleu-t:#6E93FA; --bleu-deep:#0B1A3E; --bleu-w:rgba(110,147,250,.14); --bleu-b:rgba(110,147,250,.32);
  --or:#F5B21B; --or-t:#F5B21B; --or-w:rgba(245,178,27,.14); --or-b:rgba(245,178,27,.34);
  --rouge:#F4757F; --rouge-t:#F4757F; --rouge-w:rgba(244,117,127,.14); --rouge-b:rgba(244,117,127,.32);
  --orange:#F5A14A; --orange-t:#F5A14A; --orange-w:rgba(245,161,74,.13); --orange-b:rgba(245,161,74,.30);
  --vert:#3FC98A; --vert-t:#3FC98A; --vert-w:rgba(63,201,138,.13); --vert-b:rgba(63,201,138,.30);
  --violet:#A987F5; --violet-t:#A987F5; --violet-w:rgba(169,135,245,.14); --violet-b:rgba(169,135,245,.32);
  --gris-t:#9BA7C2;
  --canvas:#06090F; --surf:#101827; --surf2:#172034; --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.06);
  --t1:#EAEEF8; --t2:#9BA7C2; --t3:#7B879F;
  --rail:#0A1226; --rail2:#070D1C; --rail-t:#FFFFFF; --rail-t2:#8E9DC4; --rail-h:rgba(255,255,255,.08); --rail-b:rgba(255,255,255,.09);
  --on-bleu:#06090F; --on-or:#0C1220;
  --sh:0 2px 12px rgba(0,0,0,.45); --sh2:0 18px 48px rgba(0,0,0,.62);
}

/* ══════════════════════════════════════════════════════════════
   COQUE
   ══════════════════════════════════════════════════════════════ */
.app{display:flex;background:var(--canvas);color:var(--t1);font:400 14px/1.5 var(--ui);font-variant-numeric:tabular-nums;height:min(84vh,860px);min-height:600px;position:relative}
.app *{box-sizing:border-box}
.app button,.app input,.app select,.app textarea{font-family:inherit;color:inherit}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* arc arc-en-ciel — l'unique ornement, et il est fonctionnel */
.arc{position:absolute;top:0;left:0;right:0;height:3px;z-index:60;background:linear-gradient(90deg,#E0231D,#F07C0C,#F5B21B,#0FA35C,#1E4FCB,#7B3FE4);opacity:0;transition:opacity .3s}
.arc.on{opacity:1;background-size:220px 100%;animation:arcSlide 1.1s linear infinite}
@keyframes arcSlide{to{background-position:220px 0}}

/* ── repère QR : le motif signature, tiré du logo ── */
.qr{width:34px;height:34px;flex:none;display:flex;align-items:center;justify-content:center;border:2px solid var(--c,var(--bleu));color:var(--c,var(--bleu));background:transparent}
.qr > .ic{width:16px;height:16px}
.qr.fill{background:var(--c);color:#fff;border-color:var(--c)}
.qr.soft{background:color-mix(in srgb,var(--c) 13%,transparent)}
.qr.lg{width:46px;height:46px}
.qr.lg > .ic{width:22px;height:22px}
.qr.sm{width:26px;height:26px;border-width:1.5px}
.qr.sm > .ic{width:13px;height:13px}

/* ── barre latérale ── */
.rail{width:250px;flex:none;background:var(--rail);display:flex;flex-direction:column;padding:12px 9px;position:relative;overflow:hidden}
.rail::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 60% at 50% -12%,rgba(255,255,255,.10),transparent 62%)}
.rail > *{position:relative;z-index:1}
.rail-brand{display:flex;align-items:center;gap:10px;padding:5px 6px 14px}
.rail-brand .mk{width:32px;height:36px;flex:none}
.rail-brand b{display:block;font:700 15px/1.15 var(--ui);letter-spacing:-.015em;color:#fff}
.rail-brand b i{font-style:normal;color:var(--or)}
.rail-brand em{display:flex;align-items:center;gap:6px;font:500 11px/1.4 var(--ui);font-style:normal;color:var(--rail-t2)}
.rail-brand em s{width:7px;height:7px;background:var(--c);text-decoration:none;flex:none}
.cmd{display:flex;align-items:center;gap:8px;width:100%;height:36px;padding:0 10px;margin-bottom:10px;background:var(--rail-h);border:1px solid var(--rail-b);border-radius:8px;color:var(--rail-t2);font:400 13px/1 var(--ui);cursor:pointer}
.cmd .ic{width:16px;height:16px}
.cmd kbd{margin-left:auto;font:600 9.5px/1 var(--ui);background:rgba(255,255,255,.12);border-radius:3px;padding:4px 5px}
.nav{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:1px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
.nav::-webkit-scrollbar{width:6px}.nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:3px}
.nv,.ng-h{display:flex;align-items:center;gap:10px;width:100%;min-height:34px;padding:0 9px;background:none;border:none;border-radius:7px;color:var(--rail-t2);font:500 12.5px/1.3 var(--ui);cursor:pointer;text-align:left}
.nv:hover,.ng-h:hover{background:var(--rail-h);color:#fff}
.nv .ic,.ng-h .ic{width:16px;height:16px}
.nv.on{background:rgba(255,255,255,.13);color:#fff;font-weight:650;box-shadow:inset 3px 0 0 var(--c,var(--or))}
.ng.open > .ng-h{color:#fff}
.ng.open > .ng-h .cv{transform:rotate(180deg)}
.cv{margin-left:auto;transition:transform .2s;width:15px!important;height:15px!important}
.ng-s{display:flex;flex-direction:column;gap:1px;padding:2px 0 5px 22px;margin-left:8px;border-left:1px solid var(--rail-b)}
.ng-s button{display:block;width:100%;text-align:left;padding:6px 9px;border:none;background:none;border-radius:6px;font:400 12px/1.3 var(--ui);color:var(--rail-t2);cursor:pointer}
.ng-s button:hover{background:var(--rail-h);color:#fff}
.ng-s button.on{background:rgba(255,255,255,.13);color:#fff;font-weight:650}
.bdg{margin-left:auto;min-width:18px;height:18px;padding:0 5px;background:var(--rouge);color:#fff;font:700 10px/18px var(--ui);text-align:center;flex:none}
.bdg.q{background:var(--rail-h);color:var(--rail-t2);border:1px solid var(--rail-b);line-height:16px;margin-right:6px}
.rail-f{border-top:1px solid var(--rail-b);padding-top:9px;margin-top:8px}
.me{display:flex;align-items:center;gap:9px;width:100%;padding:6px;background:none;border:none;border-radius:7px;cursor:pointer;text-align:left}
.me:hover{background:var(--rail-h)}
.me b{display:block;font:600 12px/1.3 var(--ui);color:#fff}
.me span{display:block;font:400 10.5px/1.3 var(--ui);color:var(--rail-t2)}
.me .qr{border-color:var(--rail-b);color:#fff;background:rgba(255,255,255,.1)}
.me .ic{margin-left:auto;width:15px;height:15px;color:var(--rail-t2)}

/* ── zone principale ── */
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--canvas)}
.top{display:flex;align-items:center;gap:12px;padding:0 20px;height:58px;flex:none;background:var(--rail);color:#fff}
.top h1{font:700 18px/1.2 var(--ui);letter-spacing:-.02em;margin:0;flex:1;min-width:0;display:flex;align-items:center;gap:11px}
.top h1 .qr{border-color:rgba(255,255,255,.42);color:#fff;background:rgba(255,255,255,.13)}
.top-r{display:flex;align-items:center;gap:8px}
.tb{width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.10);border:1px solid var(--rail-b);color:#fff;cursor:pointer;position:relative;border-radius:7px}
.tb:hover{background:rgba(255,255,255,.18)}
.tb .ic{width:17px;height:17px}
.tb i{position:absolute;top:5px;right:5px;width:7px;height:7px;background:var(--or)}
.sync{display:inline-flex;align-items:center;gap:6px;font:600 10.5px/1 var(--ui);color:#fff;background:rgba(255,255,255,.13);border:1px solid var(--rail-b);padding:6px 9px;border-radius:999px}
.sync s{width:6px;height:6px;background:var(--vert);text-decoration:none;border-radius:50%}
.sync.off s{background:var(--or)}
.page{flex:1;overflow-y:auto;padding:18px 20px 26px;display:flex;flex-direction:column;gap:14px}
.page.full{padding:0;gap:0;overflow:hidden}

/* ══════════════════════════════════════════════════════════════
   COMPOSANTS
   ══════════════════════════════════════════════════════════════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;border:1px solid var(--line);background:var(--surf);color:var(--t1);border-radius:8px;font:600 13px/1 var(--ui);cursor:pointer;white-space:nowrap;position:relative}
.btn:hover{background:var(--surf2);border-color:color-mix(in srgb,var(--t3) 45%,transparent)}
.btn .ic{width:16px;height:16px}
.btn.pri{background:var(--bleu);border-color:var(--bleu);color:var(--on-bleu)}
.btn.pri:hover{background:color-mix(in srgb,var(--bleu) 86%,#000);border-color:transparent}
.btn.gold{background:var(--or);border-color:var(--or);color:var(--on-or)}
.btn.gold:hover{background:color-mix(in srgb,var(--or) 88%,#000)}
.btn.gh{background:transparent;border-color:transparent;color:var(--t2)}
.btn.gh:hover{background:var(--surf2)}
.btn.dgr{color:var(--rouge-t);border-color:var(--rouge-b)}
.btn.dgr:hover{background:var(--rouge-w)}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.btn.sm{height:30px;padding:0 9px;font-size:12px;border-radius:7px}
.btn.lg{height:46px;padding:0 20px;font-size:14.5px}
.btn.ico{width:38px;padding:0}
.btn.ico.sm{width:30px}
.btn.full{width:100%}
.lnk{background:none;border:none;padding:0;color:var(--bleu-t);font:600 12.5px/1 var(--ui);cursor:pointer}
.lnk:hover{text-decoration:underline}

.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font:600 12px/1.3 var(--ui);color:var(--t1)}
.in{height:38px;width:100%;padding:0 11px;border:1px solid var(--line);background:var(--surf);border-radius:8px;font:400 13.5px/1 var(--ui);color:var(--t1)}
.in::placeholder{color:var(--t3)}
.in:focus{outline:none;border-color:var(--bleu);box-shadow:0 0 0 3px var(--bleu-w)}
textarea.in{height:auto;padding:9px 11px;line-height:1.5;resize:vertical}
.inw{position:relative;display:flex;align-items:center}
.inw > .ic{position:absolute;left:11px;color:var(--t3);pointer-events:none;width:17px;height:17px}
.inw .in{padding-left:36px}
.inw.grow{flex:1;min-width:150px}
.selw{position:relative;display:flex;align-items:center}
.selw select{appearance:none;padding-right:32px}
.selw > .ic{position:absolute;right:9px;color:var(--t3);pointer-events:none;width:16px;height:16px}
.hint{display:flex;align-items:center;gap:5px;font:400 11.5px/1.4 var(--ui);color:var(--t2)}
.hint .ic{width:13px;height:13px;color:var(--vert-t)}
.hint b{color:var(--t1)}

.tag{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;font:650 11px/1 var(--ui);white-space:nowrap;background:var(--surf2);color:var(--t2);border:1px solid var(--line)}
.tag s{width:6px;height:6px;background:currentColor;text-decoration:none;flex:none}
.tag.ok{background:var(--vert-w);color:var(--vert-t);border-color:var(--vert-b)}
.tag.wa{background:var(--or-w);color:var(--or-t);border-color:var(--or-b)}
.tag.no{background:var(--rouge-w);color:var(--rouge-t);border-color:var(--rouge-b)}
.tag.inf{background:var(--bleu-w);color:var(--bleu-t);border-color:var(--bleu-b)}

.alert{display:flex;gap:11px;padding:12px 14px;border:1px solid var(--line);background:var(--surf2);align-items:flex-start;border-radius:10px}
.alert .ic{width:18px;height:18px;margin-top:1px}
.alert b{display:block;font:650 13px/1.4 var(--ui);color:var(--t1)}
.alert span{display:block;font:400 12.5px/1.5 var(--ui);color:var(--t2);margin-top:2px}
.alert.ok{background:var(--vert-w);border-color:var(--vert-b)} .alert.ok > .ic{color:var(--vert-t)}
.alert.wa{background:var(--or-w);border-color:var(--or-b)} .alert.wa > .ic{color:var(--or-t)}
.alert.no{background:var(--rouge-w);border-color:var(--rouge-b)} .alert.no > .ic{color:var(--rouge-t)}
.alert.inf{background:var(--bleu-w);border-color:var(--bleu-b)} .alert.inf > .ic{color:var(--bleu-t)}

/* ── modules (la mosaïque) ── */
.card{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.card.flush{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:13px}
.card-h h2{font:650 14px/1.3 var(--ui);margin:0;flex:1;display:flex;align-items:center;gap:9px}
.cnt{font:700 11.5px/1 var(--ui);color:var(--bleu-t);background:var(--bleu-w);border:1px solid var(--bleu-b);padding:5px 8px}
.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.bento > *{grid-column:span 3;min-width:0}
.w4{grid-column:span 4!important} .w6{grid-column:span 6!important} .w8{grid-column:span 8!important} .w12{grid-column:span 12!important}

    [15,25,13,13,'F','#E0231D'],[18.5,28.5,6,6,'S','#E0231D'],
    [36,25,13,13,'F','#7B3FE4'],[39.5,28.5,6,6,'S','#7B3FE4'],

    [30,25,5,5,'S','#F07C0C'],[36.5,25,0,0,'X',''],

    [15,40,10,3.4,'S','#F5B21B'],[30,40,9,3.4,'S','#FFFFFF'],[42,40,7,3.4,'S','#E0231D'],

  ];
  let mods='';
  M.forEach(m=>{ if(m[4]==='X')return;

    else mods+='<rect x="'+m[0]+'" y="'+m[1]+'" width="'+m[2]+'" height="'+m[3]+'" fill="'+m[5]+'"/>';
  });
  const arcs=withArc?['#E0231D','#F07C0C','#F5B21B','#0FA35C','#7B3FE4'].map((c,i)=>
    '<path d="M'+(13-i*2.2)+' '+(19-i*1.6)+' Q32 '+(1-i*2.6)+' '+(51+i*2.2)+' '+(19-i*1.6)+'" fill="none" stroke="'+c+'" stroke-width="1.5" stroke-linecap="round" opacity=".95"/>').join(''):'';
  return '<svg viewBox="0 0 64 '+(withArc?80:76)+'" aria-label="SchoolSafe">'+
    '<g transform="translate(0,'+(withArc?8:2)+')">'+
    '<path d="M32 1 L61 11 V37 C61 53 48 66 32 71 C16 66 3 53 3 37 V11 Z" fill="#1E4FCB"/>'+

    '<path d="M32 6 L56 14 V37 C56 50 45 61 32 65.5 C19 61 8 50 8 37 V14 Z" fill="#173FAE"/>'+
    mods+'</g>'+arcs+'</svg>';
}

/* ═══════════ FRAGMENTS ═══════════ */
function qr(icon,color,cl){return '<span class="qr '+(cl||'')+'" style="--c:'+color+'">'+ic(icon)+'</span>';}
function tagFrais(f,solde){
  if(f==='ok')return '<span class="tag ok"><s></s>Payé</span>';
  if(f==='part')return '<span class="tag wa"><s></s>Partiel · '+fc(solde)+' FC</span>';
  return '<span class="tag no"><s></s>Impayé · '+fc(solde)+' FC</span>';
}
function mod(o){
  return '<'+(o.go?'button':'div')+' class="mod '+(o.w||'')+'" style="--c:'+o.c+'"'+(o.go?' data-go="'+o.go+'"':'')+'>'+
    '<div class="mod-t">'+qr(o.i,o.c,'soft')+'<span class="mod-l">'+esc(o.l)+'</span></div>'+
    '<div class="mod-n">'+o.n+'</div>'+
    (o.s?'<div class="mod-s '+(o.k||'')+'">'+o.s+'</div>':'')+
  '</'+(o.go?'button':'div')+'>';
}
function bars(vals,c,x){
  const mx=Math.max.apply(null,vals);
  return '<div class="bars" style="--c:'+c+'">'+vals.map((v,i)=>'<i style="--h:'+Math.round(v/mx*100)+'%"'+(i===vals.length-1?' class="on"':'')+'></i>').join('')+'</div>'+
   (x?'<div class="barsx">'+x.map(t=>'<span>'+t+'</span>').join('')+'</div>':'');
}

function palette(){
  if(!S.pal)return '';
  const n=NAV[S.role], q=S.palq.toLowerCase().trim();
  let dest=[];
  n.top.forEach(t=>dest.push({id:t.id,l:t.l,g:'Principal',i:t.i}));
  n.groups.forEach(g=>g.items.forEach(it=>dest.push({id:it[0],l:it[1],g:g.t,i:g.i})));
  const acts=[{id:'caisse',l:'Encaisser un paiement',g:'Action',i:'plus'},{id:'students',l:'Chercher un élève',g:'Action',i:'search'},{id:'scanner',l:'Ouvrir le scanner du portail',g:'Action',i:'scan'},{id:'systeme',l:'Voir le système de design',g:'Action',i:'grid'}];
  const hit=x=>!q||x.l.toLowerCase().includes(q)||x.g.toLowerCase().includes(q);
  const fd=dest.filter(hit), fa=acts.filter(hit);
  const hl=l=>{if(!q)return esc(l);const i=l.toLowerCase().indexOf(q);if(i<0)return esc(l);return esc(l.slice(0,i))+'<b style="color:var(--bleu-t);font-weight:800">'+esc(l.slice(i,i+q.length))+'</b>'+esc(l.slice(i+q.length));};
  return '<div class="ov" data-pal="close"><div class="pal" role="dialog" aria-label="Recherche">'+
   '<div class="pal-in">'+ic('search')+'<input id="palq" placeholder="Aller à un écran, ou faire une action…" value="'+esc(S.palq)+'" autocomplete="off"><kbd>Échap</kbd></div>'+
   '<div class="pal-l">'+
    (fd.length?'<div class="pal-s">Aller à — '+fd.length+' destination'+(fd.length>1?'s':'')+'</div>'+fd.slice(0,14).map(x=>
      '<button class="pal-i" data-go="'+x.id+'">'+ic(x.i)+'<span>'+hl(x.l)+'</span><em>'+esc(x.g)+'</em></button>').join(''):'')+
    (fa.length?'<div class="pal-s">Faire</div>'+fa.map(x=>'<button class="pal-i" data-go="'+x.id+'">'+ic(x.i)+'<span>'+hl(x.l)+'</span><em>'+esc(x.g)+'</em></button>').join(''):'')+
    (!fd.length&&!fa.length?'<div class="pal-e">Rien ne correspond à « '+esc(S.palq)+' ».<br>Essayez « élève », « caisse », « portail ».</div>':'')+
   '</div></div></div>';

  const n=NAV[S.role], p=PROF[S.role];

   '<button class="cmd" data-pal="open">'+ic('search')+'<span>Rechercher…</span><kbd>Ctrl K</kbd></button><nav class="nav">';
  n.top.forEach(t=>{h+='<button class="nv '+(S.page===t.id?'on':'')+'" style="--c:'+DOM[t.d]+'" data-go="'+t.id+'">'+ic(t.i)+'<span>'+esc(t.l)+'</span>'+(t.b?'<span class="bdg">'+t.b+'</span>':'')+'</button>';});
  n.groups.forEach((g,gi)=>{
    const open=S.open===gi, act=g.items.some(it=>it[0]===S.page);
    h+='<div class="ng '+(open?'open':'')+'"><button class="ng-h" style="color:'+(act?'#fff':'')+'" data-grp="'+gi+'">'+ic(g.i)+'<span>'+esc(g.t)+'</span>'+
      (g.b?'<span class="bdg q">'+g.b+'</span>':'')+ic('chev','cv')+'</button>'+
      (open?'<div class="ng-s">'+g.items.map(it=>'<button class="'+(S.page===it[0]?'on':'')+'" data-go="'+it[0]+'">'+esc(it[1])+'</button>').join('')+'</div>':'')+'</div>';
  });
  h+='</nav><div class="rail-f"><button class="me" data-todo="mon profil">'+
   '<span class="qr sm">'+ic('user')+'</span><div><b>'+esc(p.nom)+'</b><span>'+esc(p.lbl)+'</span></div>'+ic('chevr')+'</button></div></aside>';
  return h;
}
function bnHTML(){
  const n=NAV[S.role];
  return '<nav class="bn">'+n.bn.map(b=>'<button class="'+(S.page===b[0]?'on':'')+'" data-go="'+b[0]+'">'+ic(b[1])+
   (b[3]?'<span class="bdg">'+b[3]+'</span>':'')+'<small>'+esc(b[2])+'</small></button>').join('')+'</nav>';
}
function pageHTML(){
  if(V[S.page])return V[S.page]();
  const n=NAV[S.role]; let grp='', dom='systeme';
  n.groups.forEach(g=>g.items.forEach(it=>{if(it[0]===S.page){grp=g.t;dom=g.d;}}));
  return '<div class="card" style="text-align:center;padding:52px 24px">'+
   '<div style="display:flex;justify-content:center;margin-bottom:14px">'+qr('doc',DOM[dom],'lg soft')+'</div>'+
   '<div style="font:700 17px/1.3 var(--ui);margin-bottom:6px">'+esc(titre())+'</div>'+
   '<p style="font-size:13.5px;color:var(--t2);max-width:52ch;margin:0 auto 16px">Cet écran existe dans l\'application'+(grp?' — groupe « '+esc(grp)+' »':'')+
   '. Il n\'est pas dessiné dans ce prototype : les neuf écrans détaillés suffisent à juger la direction visuelle.</p>'+
   '<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">'+
   '<button class="btn pri" data-go="dashboard">Retour au tableau de bord</button>'+
   '<button class="btn" data-go="systeme">Voir le système</button></div></div>';
}
function titre(){
  if(TITRES[S.page])return TITRES[S.page];
  const n=NAV[S.role]; let t=S.page;
  n.top.forEach(x=>{if(x.id===S.page)t=x.l;});
  n.groups.forEach(g=>g.items.forEach(it=>{if(it[0]===S.page)t=it[1];}));
  return t;
}
function pageDom(){
  const n=NAV[S.role]; let d='personnes';
  n.top.forEach(x=>{if(x.id===S.page)d=x.d;});
  n.groups.forEach(g=>g.items.forEach(it=>{if(it[0]===S.page)d=g.d;}));
  return d;
}

  if(!S.logged){app.innerHTML=loginHTML();bind();return;}
  const d=pageDom();

   '<div class="arc '+(S.sync?'':'on')+'"></div>'+
   railHTML()+
   '<div class="main">'+
    '<header class="top"><h1>'+qr(navIcon(),'#fff','sm')+'<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(titre())+'</span></h1>'+
     '<div class="top-r">'+
      '<span class="sync '+(S.sync?'':'off')+'"><s></s><span>'+(S.sync?'Synchronisé':'Hors ligne')+'</span></span>'+
      '<button class="tb" data-sync="1" title="Simuler la perte de réseau">'+ic(S.sync?'check':'clock')+'</button>'+
      '<button class="tb" data-go="messages" title="Notifications">'+ic('bell')+'<i></i></button>'+
      '<button class="tb" data-todo="mon profil" title="Mon profil">'+ic('user')+'</button>'+
     '</div></header>'+
    '<div class="page'+((S.page==='scanner'||S.page==='scanner_exit')?' full':'')+'">'+pageHTML()+'</div>'+
    bnHTML()+
   '</div>'+
   drawer()+palette()+
   '<div class="toasts">'+S.toasts.map(t=>'<div class="toast">'+ic(t.i)+esc(t.t)+'</div>').join('')+'</div>'+
  '</div>';
  bind();
}
function navIcon(){

  n.groups.forEach(g=>g.items.forEach(it=>{if(it[0]===S.page)i=g.i;}));
  if(S.page==='systeme')i='grid';
  return i;
}

/* ═══════════ ÉVÉNEMENTS ═══════════ */
function bind(){
  app.querySelectorAll('[data-go]').forEach(el=>el.onclick=e=>{e.stopPropagation();go(el.dataset.go);});
  app.querySelectorAll('[data-grp]').forEach(el=>el.onclick=()=>{const i=+el.dataset.grp;S.open=(S.open===i?null:i);draw();});
  app.querySelectorAll('[data-todo]').forEach(el=>el.onclick=e=>{e.stopPropagation();toast('« '+el.dataset.todo+' » n\'est pas dans le prototype','alert');});
  app.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{S.tab=el.dataset.tab;draw();});
  app.querySelectorAll('[data-cf]').forEach(el=>el.onclick=()=>{S.cf=el.dataset.cf;draw();});
  app.querySelectorAll('[data-sel]').forEach(el=>{const f=()=>{const k=el.dataset.sel;S.sel[k]=!S.sel[k];draw();};el.onclick=f;el.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();f();}};});
  app.querySelectorAll('[data-clear]').forEach(el=>el.onclick=()=>{S.sel={};draw();});
  app.querySelectorAll('[data-drawer]').forEach(el=>el.onclick=e=>{e.stopPropagation();const v=el.dataset.drawer;S.drawer=(v==='close'?null:+v);draw();});
  app.querySelectorAll('[data-msg]').forEach(el=>el.onclick=()=>{S.msg=+el.dataset.msg;MSGS[S.msg].nl=0;draw();});
  app.querySelectorAll('[data-scan]').forEach(el=>el.onclick=()=>{S.scan++;draw();});
  app.querySelectorAll('[data-pres]').forEach(el=>el.onclick=()=>{const p=el.dataset.pres.split(':');S.pres[p[0]]=p[1];draw();});
  app.querySelectorAll('[data-sync]').forEach(el=>el.onclick=()=>{S.sync=!S.sync;draw();toast(S.sync?'Réseau rétabli — la file est repartie':'Hors ligne — les gestes sont mis en file','clock');});
  app.querySelectorAll('[data-login]').forEach(el=>el.onclick=()=>{S.logged=true;S.page=(S.role==='gardien'?'scanner':'dashboard');draw();});
  app.querySelectorAll('[data-pay]').forEach(el=>el.onclick=()=>{toast('Paiement enregistré — reçu n° 0413','check');S.page='dashboard';draw();});
  app.querySelectorAll('[data-send]').forEach(el=>el.onclick=()=>{toast(S.sync?'Réponse envoyée à la famille':'Hors ligne — la réponse partira au retour du réseau',S.sync?'check':'clock');});
  const q=app.querySelector('#q');
  if(q){q.oninput=()=>{S.q=q.value;draw();const n=app.querySelector('#q');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);}};}
  app.querySelectorAll('[data-pal]').forEach(el=>el.onclick=e=>{
    if(el.dataset.pal==='open'){S.pal=true;S.palq='';draw();const i=app.querySelector('#palq');if(i)i.focus();}
    else if(e.target===el){S.pal=false;draw();}
  });
  const pq=app.querySelector('#palq');
  if(pq){pq.oninput=()=>{S.palq=pq.value;draw();const n=app.querySelector('#palq');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);}};
    pq.onkeydown=e=>{if(e.key==='Escape'){S.pal=false;draw();}
      if(e.key==='Enter'){const f=app.querySelector('.pal-l .pal-i');if(f)f.click();}};}
}
function go(id){
  if(id==='menu'&&S.dev!=='phone'){S.pal=true;S.palq='';draw();const i=app.querySelector('#palq');if(i)i.focus();return;}
  S.page=id;S.pal=false;S.drawer=null;
  const n=NAV[S.role];
  n.groups.forEach((g,gi)=>{if(g.items.some(it=>it[0]===id))S.open=gi;});
  draw();
  const pc=app.querySelector('.page'); if(pc)pc.scrollTop=0;
  if(!IMPL[id]&&!V[id]){/* l'écran de remplacement est affiché, rien de muet */}
}
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();S.pal=true;S.palq='';draw();const i=app.querySelector('#palq');if(i)i.focus();}
  if(e.key==='Escape'){if(S.pal){S.pal=false;draw();}else if(S.drawer){S.drawer=null;draw();}}
});

/* ═══════════ BARRE DE DÉMONSTRATION ═══════════ */
const ROLES=[['direction','Direction 1'],['direction2','Direction 2'],['direction3','Caisse'],['enseignant','Enseignant'],['gardien','Gardien'],['parent','Parent']];
const DEVS=[['desk','Ordinateur'],['tab','Tablette'],['phone','Téléphone']];
const THEMES=[['light','Clair'],['dark','Sombre']];
function seg(el,items,cur,fn){
  el.innerHTML=items.map(i=>'<button aria-pressed="'+(i[0]===cur?'true':'false')+'" data-v="'+i[0]+'">'+i[1]+'</button>').join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>fn(b.dataset.v));
}
function drawDemo(){
  seg(document.getElementById('segRole'),ROLES,S.role,v=>{
    S.role=v;S.open=null;S.drawer=null;S.pal=false;S.sel={};S.q='';S.cf='';
    S.page=(v==='gardien'?'scanner':'dashboard');
    drawDemo();draw();
  });
  seg(document.getElementById('segDev'),DEVS,S.dev,v=>{S.dev=v;app.dataset.dev=v;drawDemo();draw();});
  seg(document.getElementById('segTheme'),THEMES,S.theme,v=>{S.theme=v;app.dataset.t=v;drawDemo();});
}
