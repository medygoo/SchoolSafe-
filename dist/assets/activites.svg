<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
<!-- ══════════════════════════════════════════════════════════════════════
     Les activités parascolaires — Complexe Scolaire Le Sage

     DES DESSINS, PAS DES PHOTOGRAPHIES INVENTÉES.
     Mettre sur le site d'une vraie école des enfants fabriqués, présentés
     comme ses élèves, tromperait les familles qui les regardent. Les vraies
     photographies de l'école sont ailleurs sur le site ; ici, ce sont des
     dessins, et ils se voient comme tels.

     Chaque enfant porte la tenue de l'école — GRIS et BLANC, la charte — et
     l'insigne : l'étoile d'or de l'emblème, sur la poitrine.

     Un fichier, huit dessins, environ 9 Ko. Une photographie en pèserait
     deux cents à elle seule.
     ══════════════════════════════════════════════════════════════════════ -->
<defs>
  <style>
    .peau{fill:#6b4a2f}.peau2{fill:#5a3d26}
    .chev{fill:#2b1d12}
    .haut{fill:#ffffff}          /* chemise blanche  */
    .bas{fill:#556777}           /* bas gris — la charte */
    .bas2{fill:#657786}
    .or{fill:#c09018}.or2{fill:#e2b84f}
    .encre{fill:#1a2228}
    .trait{fill:none;stroke:#1a2228;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
    .traitg{fill:none;stroke:#556777;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
    .surf{fill:#f0f1f2}.surf2{fill:#dadee2}
  </style>
  <!-- l'insigne de l'école, posé sur chaque tenue -->
  <g id="insigne">
    <circle r="5.2" class="or"/>
    <path d="M0,-3.4 1,-1 3.3,-1 1.4,.4 2.1,2.8 0,1.4 -2.1,2.8 -1.4,.4 -3.3,-1 -1,-1Z" fill="#fff"/>
  </g>
</defs>

<!-- ── INFORMATIQUE ────────────────────────────────────────────────── -->
<symbol id="act-informatique" viewBox="0 0 160 160">
  <rect x="6" y="6" width="148" height="148" rx="16" class="surf"/>
  <!-- bureau -->
  <rect x="26" y="104" width="108" height="7" rx="3" class="bas2"/>
  <!-- écran -->
  <rect x="78" y="60" width="52" height="36" rx="4" class="encre"/>
  <rect x="82" y="64" width="44" height="28" rx="2" class="or2"/>
  <rect x="96" y="96" width="16" height="8" class="bas2"/>
  <!-- enfant -->
  <circle cx="52" cy="56" r="15" class="peau"/>
  <path d="M37,50a15,15 0 0 1 30,0q-4-7-15-7t-15,7Z" class="chev"/><path d="M38,49a14,13 0 0 1 28,0Z" class="chev"/>
  <circle cx="47" cy="57" r="1.9" class="encre"/><circle cx="58" cy="57" r="1.9" class="encre"/>
  <path d="M48,63q4,3.5 8,0" class="trait"/>
  <path d="M38,104V84a14,14 0 0 1 28,0v20Z" class="haut"/>
  <path d="M38,104h28v10H38Z" class="bas"/>
  <use href="#insigne" x="52" y="88"/>
  <path d="M66,90q10,6 14,10" class="traitg" stroke="#6b4a2f"/>
  <circle cx="82" cy="101" r="4.4" class="peau2"/>
</symbol>

